paths:
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticates a user with email and password. Returns user info and sets a JWT in an HTTP-only cookie.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: "mypassword123"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: >
                HTTP-only cookie containing the JWT token.  
                Example: `jwt=abc123; HttpOnly; SameSite=Lax; Max-Age=2592000`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 65c1234abc7890def1234567
                      userName:
                        type: string
                        example: Dishank
                      email:
                        type: string
                        example: dishank@gmail.com
                      profileImg:
                        type: string
                        nullable: true
                        example: "https://cloudinary.com/abc/user.png"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: VALIDATION-ERROR
                  message:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: field
                        msg:
                          type: string
                          example: Invalid email
                        path:
                          type: string
                          example: email
                        location:
                          type: string
                          example: body
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: INVALID-CREDENTIALS
                  message:
                    type: string
                    example: Invalid email or password.
        "500":
          description: Server error during login
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SERVER-ERROR
                  message:
                    type: string
                    example: Server error during login.