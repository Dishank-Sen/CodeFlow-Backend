paths:
  /api/v1/repos/new:
    post:
      summary: Create a new repository for the authenticated user
      description: >
        Creates a new repository for the currently authenticated user, stores it in both
        the User document and the Repo collection, and generates a remote URL. Request body
        is validated (repoName pattern and visibility). Operation is atomic using transactions.
      tags:
        - Repositories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repoName
                - visibility
              properties:
                repoName:
                  type: string
                  example: codeflow-backend
                  description: >
                    Repository name. Allowed characters: letters, numbers, dot, underscore, hyphen.
                    No spaces.
                description:
                  type: string
                  example: "Backend service for Codeflow"
                visibility:
                  type: string
                  description: Repository visibility
                  enum:
                    - public
                    - private
                  example: public
      responses:
        "201":
          description: Repository created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: repository created
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 64a7f3b2e7c8d12f1a2b3c4d
                      repoName:
                        type: string
                        example: codeflow-backend
                      userName:
                        type: string
                        example: Dishank-Sen
                      description:
                        type: string
                        example: Backend service for Codeflow
                      visibility:
                        type: string
                        example: public
                      remoteUrl:
                        type: string
                        example: https://yourdomain.com/dishank/codeflow-backend
                      pinned:
                        type: boolean
                        example: false
                      stars:
                        type: integer
                        example: 0
                      forks:
                        type: integer
                        example: 0
                      createdAt:
                        type: string
                        format: date-time
                        example: "2025-10-17T04:38:35.826Z"

        "400":
          description: Validation failed (bad request)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: VALIDATION_ERROR
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        msg:
                          type: string
                        param:
                          type: string
                        location:
                          type: string
        "401":
          description: User info missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: NO-USER-INFO
                  message:
                    type: string
                    example: No user info found

        "409":
          description: Repository name already taken for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: REPO-NAME-ALREADY-TAKEN
                  message:
                    type: string
                    example: repository name already taken

        "500":
          description: Server error while creating repository
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SERVER-ERROR
                  message:
                    type: string
                    example: internal server error
