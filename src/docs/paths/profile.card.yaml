paths:
  /api/v1/profile/card:
    get:
      summary: Get profile card data of authenticated user
      description: Returns minimal profile information needed for profile card UI components.
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile card data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User data fetched
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        description: Unique identifier of the authenticated user
                        example: 68f0abffc8d1a0c71182c13f
                      userName:
                        type: string
                        example: Dishank-Sen
                      email:
                        type: string
                        format: email
                        example: dishank@gmail.com
                      profileImg:
                        type: string
                        nullable: true
                        description: URL of the user's profile image
                        example: https://res.cloudinary.com/dijo7olfy/image/upload/v1760675486/profileImages/ojd9ohscorq484db8znp.jpg
                      bio:
                        type: string
                        description: Short bio or description of the user
                        example: Backend developer and WebRTC enthusiast.
                      followerCount:
                        type: integer
                        description: Total number of followers
                        example: 12
                      followingCount:
                        type: integer
                        description: Total number of users this user is following
                        example: 7

        "401":
          description: Missing or invalid user authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: NO-USER-INFO
                  message:
                    type: string
                    example: No user info found

        "500":
          description: Internal server error while fetching profile card data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SERVER-ERROR
                  message:
                    type: string
                    example: Server error
