paths:
  /api/v1/profile/card:
    get:
      summary: Get profile card data of authenticated user
      description: Returns minimal profile information needed for profile card UI components.
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile card data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User data fetched
                  data:
                    type: object
                    properties:
                      userName:
                        type: string
                        example: dishank_01
                      profileImg:
                        type: string
                        nullable: true
                        example: https://cloudinary.com/abc/user.png

        "401":
          description: Missing or invalid user authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: NO-USER-INFO
                  message:
                    type: string
                    example: No user info found

        "500":
          description: Internal server error while fetching profile card data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: SERVER-ERROR
                  message:
                    type: string
                    example: Server error
