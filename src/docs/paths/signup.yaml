paths:
  /api/v1/auth/signup:
    post:
      summary: User signup
      description: Creates a new user with optional profile image. Uploads the image to Cloudinary and stores the URL.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - userName
                - email
                - password
              properties:
                userName:
                  type: string
                  example: dishank_01
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: "StrongPass123!"
                profileImg:
                  type: string
                  format: binary
                  description: Optional profile image file. If not provided, a default profile image is used.
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully! Please log in.
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: VALIDATION-ERROR
                  message:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: field
                        msg:
                          type: string
                          example: Invalid email
                        path:
                          type: string
                          example: email
                        location:
                          type: string
                          example: body
        "409":
          description: User already exists with this email or username
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: USER-ALREADY-EXISTS
                  message:
                    type: string
                    example: user already exists with this username or email
        "500":
          description: Server error during signup
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Error while uploading profile image
                    properties:
                      error:
                        type: string
                        example: SERVER-ERROR
                      message:
                        type: string
                        example: Error uploading profile image.
                  - type: object
                    description: Generic internal server error
                    properties:
                      error:
                        type: string
                        example: SERVER-ERROR
                      message:
                        type: string
                        example: internal server error
